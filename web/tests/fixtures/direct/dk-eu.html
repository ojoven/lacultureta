Félix Zuritaren Libres de acoso dokumentalaren proiekzioa, Emakumearen aurkako Indarkeria Desagerrarazteko Nazioarteko Egunaren harira. Ondoren, Nerea Redondok dinamizatutako solasaldia egingo da.
Libres de acoso, Mundu Bakeanek ekoitzitako dokumentalak, Latinoamerikako eta Euskadiko emakumeen ahotsak biltzen ditu. Zuzenbidearen, psikologiaren, antropologiaren, gizarte-lanaren, kazetaritzaren eta aktibismo feministaren arloetatik, sexu-jazarpenaren biktimei laguntzen emandako esperientziak partekatzen dituzte.Dokumentalak jarraipena ematen dio Guatemalako Mujeres Transformando el Mundo elkarteak eta Euskadiko Mundu Bakeanek «Sexu-jazarpenetik erreparaziora» prozesuaren bidez abiatutako elkarrizketari eta hausnarketari. Biktimen salaketa-prozesuan dituzten zailtasunak, gizartearen eta erakundeen aldetik jasaten duten birbiktimizazioa, eta justiziarako zein erreparaziorako bideak jorratzen ditu.Nevenka Fernándezek ere testigantza berezia eskaintzen du filmean. Espainian politikari baten aurkako sexu-jazarpenagatik kondena lortzen aitzindaria izan zen. Dokumentalak gogora ekartzen duenez, garaipen judiziala lortu bazuen ere, urteak itxaron behar izan zituen merezi zuen aitortza soziala jasotzeko. Haren ausardiak beste emakume batzuei bidea ireki zien, eta gaur egun emakumeen eskubideen atzerapausoen mehatxuen aurrean defendatu beharreko lorpen kolektibo baten ikur da.Memoriari, justizia feministari eta indarkeriarik gabeko bizitza bizitzeko eskubideari buruzko hausnarketa.
