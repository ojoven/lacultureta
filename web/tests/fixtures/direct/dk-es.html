Libres de acoso, una producción de Mundu Bakean, reúne las voces de mujeres de América Latina y Euskadi que, desde el ámbito jurídico, la psicología, la antropología, el trabajo social, el periodismo y el activismo feminista, comparten sus experiencias en el acompañamiento a víctimas de acoso sexual.El documental da continuidad al diálogo y reflexión que Mujeres Transformando el Mundo de Guatemala y Mundu Bakean de Euskadi inician con el proceso “Del acoso sexual a la reparación” y aborda las dificultades que tienen las víctimas a la hora de denunciar el acoso, la revictimización social e institucional y los caminos hacia la justicia y la reparación.Con el testimonio especial de Nevenka Fernández, pionera en conseguir una condena por acoso sexual contra un político en España, el filme recuerda cómo, pese a su victoria judicial, tuvo que esperar años para recibir el reconocimiento social que merecía. Su valentía abrió camino a otras mujeres y simboliza una conquista colectiva que hoy resulta imprescindible defender ante las amenazas de retroceso en los derechos de las mujeres.Una reflexión sobre la memoria, la justicia feminista y el derecho a vivir una vida libre de violencias.","startDate":"2026-11-24T18:00","image":["https://www.donostiakultura.eus/imgs/particulares/casas-cultura/intxaurrondo/agenda/2026/11-azaroa/INTX_Libres_de_acoso_t.webp"],"eventAttendanceMode":"https://schema.org/OfflineEventAttendanceMode","provider":{"@type":"Organization","name":"Donostia Kultura","sameAs":"https://www.donostiakultura.eus"},"location":{"@type":"Place","address":{"@type":"PostalAddress","addressLocality":"Donostia","url":"https://www.google.es/maps/place/Casa+de+Cultura+-+Biblioteca+Intxaurrondo/@43.3136808,-1.9552637,17z/data=!3m1!4b1!4m5!3m4!1s0xd51af80a2bbcc43:0xc082401c3192e3ae!8m2!3d43.3136808!4d-1.953075"},"name":"Intxaurrondo K.E."},"endDate":"2026-11-24T18:00","eventStatus":"https://schema.org/EventScheduled","organizer":{"@type":"Organization","name":"Donostia Kult
